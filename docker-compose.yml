services:
  mapping-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: mapping-tracker:local
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      MAPPING_DEDUP_HEAP: "${MAPPING_DEDUP_HEAP:-8g}"
      TMPDIR: /app/mapping_tracker/data/tmp
    volumes:
      - ${DATA_DIR:-./data}:/app/mapping_tracker/data
